services:
  postgres:
    image: postgres:16-alpine
    container_name: dime-postgres
    environment:
      POSTGRES_USER: dime_user
      POSTGRES_PASSWORD: dime_password
      POSTGRES_DB: dime
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dime_user -d dime"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: