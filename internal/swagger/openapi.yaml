openapi: 3.0.3
info:
  title: Dime API
  version: 1.0.0
  description: REST API for tracking transactions and budgets.
servers:
  - url: http://localhost:8080
paths:
  /auth/token:
    post:
      summary: Generate a JWT token for a user
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /transactions:
    post:
      summary: Create a transaction
      operationId: createTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
            examples:
              expense:
                value:
                  user_id: u1
                  type: expense
                  amount: 75.25
                  category: food
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - cannot access another user's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List a user's transactions (paginated)
      operationId: listTransactionsByUser
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          description: The user's unique identifier
          schema:
            type: string
          example: u1
        - name: page
          in: query
          required: false
          description: Page number (1-based, default 1)
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: page_size
          in: query
          required: false
          description: Number of items per page (default 20, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 10
      responses:
        '200':
          description: Paginated list of transactions for the requested user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '400':
          description: Missing user_id query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - cannot access another user's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /transactions/{id}:
    get:
      summary: Get a transaction by ID
      operationId: getTransactionByID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          description: Missing or invalid authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - cannot access another user's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /budgets:
    post:
      summary: Create a budget
      operationId: createBudget
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetRequest'
            examples:
              food:
                value:
                  user_id: u1
                  category: food
                  limit: 100
      responses:
        '201':
          description: Budget created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - cannot access another user's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /budgets/status:
    get:
      summary: Check budget status
      operationId: checkBudgetStatus
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          example: u1
        - name: category
          in: query
          required: true
          schema:
            type: string
          example: food
      responses:
        '200':
          description: Budget status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetStatusResponse'
        '400':
          description: Missing query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - cannot access another user's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Budget not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /metrics:
    get:
      summary: Metrics snapshot
      operationId: metricsSnapshot
      responses:
        '200':
          description: Current metrics counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from POST /auth/token
  schemas:
    TokenRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          description: Unique identifier for the user
    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token
    CreateTransactionRequest:
      type: object
      required:
        - user_id
        - type
        - amount
        - category
      properties:
        user_id:
          type: string
        type:
          type: string
          enum:
            - income
            - expense
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        category:
          type: string
          minLength: 1
          maxLength: 50
    Transaction:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        type:
          type: string
          enum:
            - income
            - expense
        amount:
          type: number
          format: double
        category:
          type: string
        created_at:
          type: string
          format: date-time
    CreateBudgetRequest:
      type: object
      required:
        - user_id
        - category
        - limit
      properties:
        user_id:
          type: string
        category:
          type: string
          minLength: 1
          maxLength: 50
        limit:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
    Budget:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        category:
          type: string
        limit:
          type: number
          format: double
        spent:
          type: number
          format: double
    BudgetStatusResponse:
      type: object
      properties:
        user_id:
          type: string
        category:
          type: string
        status:
          type: string
          enum:
            - within budget
            - near limit
            - over budget
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          description: List of transactions for the current page
          items:
            $ref: '#/components/schemas/Transaction'
        page:
          type: integer
          description: Current page number (1-based)
          example: 1
        page_size:
          type: integer
          description: Number of items per page
          example: 20
        total_count:
          type: integer
          description: Total number of transactions for this user
          example: 150
        total_pages:
          type: integer
          description: Total number of pages available
          example: 8
        has_next:
          type: boolean
          description: Whether there is a next page
          example: true
        has_prev:
          type: boolean
          description: Whether there is a previous page
          example: false
      example:
        data:
          - id: "abc123def456"
            user_id: "u1"
            type: "expense"
            amount: 50.00
            category: "food"
            created_at: "2024-01-15T10:30:00Z"
          - id: "def789ghi012"
            user_id: "u1"
            type: "expense"
            amount: 25.50
            category: "transport"
            created_at: "2024-01-14T15:20:00Z"
        page: 1
        page_size: 20
        total_count: 150
        total_pages: 8
        has_next: true
        has_prev: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
            - unhealthy
        time:
          type: string
          format: date-time
    MetricsResponse:
      type: object
      additionalProperties:
        type: integer
        format: int64
      example:
        requests_total: 42
        requests_200: 38
        requests_429: 4
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: INVALID_REQUEST
            message:
              type: string
              description: Human-readable error message
              example: amount must be greater than zero
